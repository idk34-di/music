<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MUSIC CD</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;500;600&display=swap');
:root{
  --bg:#0a0e14;--surface:#111820;--surface2:#1a2330;
  --border:#1e3040;--accent:#5bc8e8;--accent2:#00ff88;
  --accent3:#ff6b6b;--text:#c8dce8;--text2:#4a7090;
  --screen-bg:#000d14;--screen-text:#00d4ff;--screen-dim:#003355;
  --pad:#5bc8e8;--pad-text:#001a28;
  --font-mono:'Share Tech Mono',monospace;--font-ui:'Rajdhani',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--font-ui);height:100dvh;display:flex;flex-direction:column;overflow:hidden;transition:background .4s,color .4s;}

header{display:flex;align-items:center;justify-content:space-between;padding:.6rem 1.2rem;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0;position:relative;}
.theme-picker{display:flex;align-items:center;gap:6px;}
.theme-label{font-family:var(--font-mono);font-size:9px;color:var(--text2);letter-spacing:1px;margin-right:4px;}
.theme-dot{width:18px;height:18px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .15s,border-color .15s;flex-shrink:0;}
.theme-dot:hover{transform:scale(1.25);}
.theme-dot.active{border-color:var(--text);transform:scale(1.2);}
.app-title{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--font-mono);font-size:11px;color:var(--accent);letter-spacing:2px;text-decoration:none;cursor:pointer;transition:color .15s;white-space:nowrap;}
.app-title:hover{color:var(--accent2);}

.main-wrap{flex:1;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;align-items:center;padding:1.4rem 1rem;gap:1.4rem;max-width:520px;margin:0 auto;width:100%;}

/* CASSETTE */
.deck{width:100%;display:flex;flex-direction:column;align-items:center;gap:1.2rem;}
.cassette-body{width:100%;max-width:340px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:14px 16px 18px;box-shadow:0 6px 18px rgba(0,0,0,.25);transition:transform .25s;}
.cassette-body.ejecting{transform:translateY(-14px) scale(1.02);}
.cassette-label{background:var(--screen-bg);border:1px solid #002233;border-radius:3px;padding:8px 10px;font-family:var(--font-mono);color:var(--screen-text);font-size:13px;letter-spacing:1px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:12px;}
.cassette-window{background:var(--screen-bg);border:1px solid #002233;border-radius:6px;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;position:relative;}
.cassette-window::before{content:'';position:absolute;left:24%;right:24%;top:50%;height:1px;background:var(--screen-dim);}
.reel{width:52px;height:52px;border-radius:50%;background:repeating-conic-gradient(var(--text2) 0deg 8deg, transparent 8deg 90deg);border:2px solid var(--text2);position:relative;animation:spin 2.8s linear infinite;animation-play-state:paused;z-index:1;}
.reel .hub{position:absolute;top:50%;left:50%;width:14px;height:14px;background:var(--screen-bg);border:2px solid var(--text2);border-radius:50%;transform:translate(-50%,-50%);}
.reel.playing{animation-play-state:running;}
.reel.fast-fwd{animation-duration:.35s;}
.reel.fast-rew{animation-duration:.35s;animation-direction:reverse;}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.cassette-screws{display:flex;justify-content:space-between;margin-top:12px;padding:0 4px;}
.cassette-screws span{width:6px;height:6px;border-radius:50%;background:var(--border);}

.counter-row{display:flex;justify-content:space-between;align-items:center;font-family:var(--font-mono);font-size:11px;color:var(--screen-dim);width:100%;max-width:340px;}
.seek{width:100%;accent-color:var(--screen-text);cursor:pointer;}

.controls-row{display:flex;align-items:center;justify-content:center;gap:14px;}
.ctrl-btn{width:52px;height:52px;border-radius:50%;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s;user-select:none;touch-action:manipulation;}
.ctrl-btn:hover{border-color:var(--accent);color:var(--accent);}
.ctrl-btn:active{background:var(--surface2);}
.ctrl-btn.play{width:64px;height:64px;background:var(--accent);color:var(--pad-text);border-color:var(--accent);font-size:22px;}
.ctrl-btn.play:hover{background:var(--accent2);border-color:var(--accent2);color:var(--pad-text);}

.stop-wrap{display:flex;flex-direction:column;align-items:center;gap:5px;}
.ctrl-btn.stop{width:52px;height:52px;border-radius:50%;border:1px solid var(--accent3);color:var(--accent3);background:var(--surface);font-size:16px;}
.ctrl-btn.stop:hover{background:var(--accent3);color:#fff;}
.stop-hint{font-family:var(--font-mono);font-size:8px;color:var(--text2);letter-spacing:.5px;text-align:center;}

.vol-row{display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:14px;color:var(--text2);width:100%;max-width:340px;}
.vol-row input[type=range]{flex:1;accent-color:var(--accent);}

.btn{padding:7px 14px;border-radius:2px;border:1px solid var(--border);background:transparent;color:var(--text);font-family:var(--font-mono);font-size:11px;cursor:pointer;letter-spacing:1px;transition:all .1s;}
.btn:hover{border-color:var(--accent);color:var(--accent);}
.btn.green{border-color:var(--accent2);color:var(--accent2);}
.btn.green:hover{background:var(--accent2);color:#001a10;}
.btn.danger{border-color:var(--accent3);color:var(--accent3);}
.btn.danger:hover{background:var(--accent3);color:#fff;}
.btn.active{background:var(--accent);color:var(--pad-text);border-color:var(--accent);}
#fileInput{display:none;}
.open-lib{font-family:var(--font-mono);font-size:10px;letter-spacing:1px;color:var(--text2);background:none;border:none;cursor:pointer;text-decoration:underline;}
.open-lib:hover{color:var(--accent);}

/* LIBRARY OVERLAY */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:500;opacity:0;pointer-events:none;transition:opacity .2s;}
.overlay.show{opacity:1;pointer-events:auto;}
.overlay-panel{background:var(--surface);border-top:1px solid var(--border);border-radius:14px 14px 0 0;width:100%;max-width:640px;max-height:82vh;display:flex;flex-direction:column;transform:translateY(20px);transition:transform .2s;}
.overlay.show .overlay-panel{transform:translateY(0);}
.overlay-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);}
.overlay-head .screen-label{font-family:var(--font-mono);font-size:11px;color:var(--accent);letter-spacing:2px;}
.overlay-actions{display:flex;gap:8px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--border);}
.carousel{display:flex;gap:12px;overflow-x:auto;padding:16px;scroll-snap-type:x proximity;}
.cass-card{flex:0 0 128px;scroll-snap-align:center;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;transition:transform .15s,border-color .15s;}
.cass-card:hover{border-color:var(--accent);transform:translateY(-3px);}
.cass-card.active{border-color:var(--accent);}
.cass-mini{width:100%;height:46px;background:var(--screen-bg);border-radius:3px;display:flex;align-items:center;justify-content:center;gap:10px;}
.mini-reel{width:14px;height:14px;border-radius:50%;background:repeating-conic-gradient(var(--text2) 0deg 8deg, transparent 8deg 90deg);border:1px solid var(--text2);}
.cass-title{font-family:var(--font-mono);font-size:10px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;}
.cass-dur{font-family:var(--font-mono);font-size:8px;color:var(--text2);}
.cass-btns{display:flex;gap:8px;align-items:center;}
.cass-btns button{background:none;border:none;color:var(--text2);font-size:13px;cursor:pointer;padding:0 2px;}
.cass-btns button.fav.on{color:#ffd166;}
.cass-btns button.del:hover{color:var(--accent3);}
.pl-empty{padding:2rem 1rem;text-align:center;font-family:var(--font-mono);font-size:10px;color:var(--text2);letter-spacing:1px;width:100%;}

.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--accent);color:var(--pad-text);font-family:var(--font-mono);font-size:11px;letter-spacing:1px;padding:9px 18px;border-radius:2px;z-index:9998;transition:transform .3s;white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);}
.toast.err{background:var(--accent3);color:#fff;}

::-webkit-scrollbar{width:4px;height:4px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
@media(max-width:400px){.app-title{font-size:9px;letter-spacing:1px;}}
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<header>
  <div class="theme-picker">
    <span class="theme-label">THEME</span>
    <div id="theme-dots" style="display:flex;gap:6px"></div>
  </div>
  <a class="app-title" href="https://idk34-di.github.io/" target="_blank" rel="noopener">MUSIC CD</a>
  <div style="display:flex;align-items:center;gap:10px;font-family:var(--font-mono);font-size:11px;">
    <span id="contatore" style="color:var(--text2);">👁 …</span>
    <button id="login-btn" class="btn" onclick="accedi()">ACCEDI</button>
    <span id="user-info" style="display:none;color:var(--accent2);cursor:pointer;" onclick="esci()"></span>
  </div>
</header>

<div class="main-wrap">

  <div class="deck">
    <div class="cassette-body" id="cassetteBody">
      <div class="cassette-label" id="cassetteLabel">NESSUNA CASSETTA</div>
      <div class="cassette-window">
        <div class="reel" id="reelL"><div class="hub"></div></div>
        <div class="reel" id="reelR"><div class="hub"></div></div>
      </div>
      <div class="cassette-screws"><span></span><span></span><span></span><span></span></div>
    </div>

    <div class="counter-row"><span id="curTime">0:00</span><span id="durTime">0:00</span></div>
    <input type="range" class="seek" id="seekBar" min="0" max="100" value="0" style="max-width:340px">

    <div class="controls-row">
      <button class="ctrl-btn" id="rewBtn">◀◀</button>
      <button class="ctrl-btn play" id="playBtn" onclick="togglePlay()">▶</button>
      <button class="ctrl-btn" id="ffBtn">▶▶</button>
    </div>

    <div class="stop-wrap">
      <button class="ctrl-btn stop" id="stopBtn">⏹</button>
      <span class="stop-hint">1× STOP · 2× CAMBIA CASSETTA</span>
    </div>

    <div class="vol-row">
      🔉 <input type="range" id="volBar" min="0" max="100" value="80"> 🔊
    </div>

    <button class="open-lib" onclick="openLibrary()">📼 apri libreria cassette</button>
  </div>

</div>

<!-- LIBRARY OVERLAY -->
<div class="overlay" id="libraryOverlay">
  <div class="overlay-panel">
    <div class="overlay-head">
      <span class="screen-label" id="libHeadCount">LIBRERIA CASSETTE</span>
      <button class="btn" onclick="closeLibrary()">× CHIUDI</button>
    </div>
    <div class="overlay-actions">
      <button class="btn green" onclick="document.getElementById('fileInput').click()">+ AGGIUNGI</button>
      <button class="btn" id="favBtn" onclick="toggleFavFilter()">★ PREFERITI</button>
      <button class="btn" id="syncBtn" style="display:none" onclick="syncLocalToCloud()">☁ SINCRONIZZA</button>
      <button class="btn danger" onclick="eliminaTutto()">🗑 ELIMINA TUTTO</button>
      <input type="file" id="fileInput" accept="audio/*" multiple onchange="handleFiles(this.files)">
    </div>
    <div class="carousel" id="carousel"></div>
  </div>
</div>

<script>
'use strict';

/* THEMES */
const THEMES=[
  {name:'Cyan Night', dot:'#5bc8e8',vars:{'--bg':'#0a0e14','--surface':'#111820','--surface2':'#1a2330','--border':'#1e3040','--accent':'#5bc8e8','--accent2':'#00ff88','--accent3':'#ff6b6b','--text':'#c8dce8','--text2':'#4a7090','--screen-bg':'#000d14','--screen-text':'#00d4ff','--screen-dim':'#003355','--pad':'#5bc8e8','--pad-text':'#001a28'}},
  {name:'Purple Haze',dot:'#b06ef3',vars:{'--bg':'#0d0814','--surface':'#160e20','--surface2':'#1f1530','--border':'#2d1f45','--accent':'#b06ef3','--accent2':'#f06edf','--accent3':'#ff6b6b','--text':'#d8c8f0','--text2':'#5a3a80','--screen-bg':'#08040f','--screen-text':'#c87fff','--screen-dim':'#2a0a50','--pad':'#b06ef3','--pad-text':'#0d0814'}},
  {name:'Sunset',     dot:'#ff8c42',vars:{'--bg':'#14080a','--surface':'#201010','--surface2':'#301818','--border':'#451f1f','--accent':'#ff8c42','--accent2':'#ffd166','--accent3':'#ef476f','--text':'#f0d8c8','--text2':'#804030','--screen-bg':'#0f0508','--screen-text':'#ff8c42','--screen-dim':'#500f00','--pad':'#ff8c42','--pad-text':'#14080a'}},
  {name:'Ice',        dot:'#a8d8ea',vars:{'--bg':'#f0f6fa','--surface':'#e4eef5','--surface2':'#d0e4f0','--border':'#b0ccde','--accent':'#1e7fb5','--accent2':'#16a085','--accent3':'#e74c3c','--text':'#1a3a4a','--text2':'#5a8aaa','--screen-bg':'#0a2030','--screen-text':'#5bc8e8','--screen-dim':'#0a3050','--pad':'#1e7fb5','--pad-text':'#f0f6fa'}},
  {name:'Matrix',     dot:'#00ff41',vars:{'--bg':'#000000','--surface':'#030f03','--surface2':'#071807','--border':'#0a280a','--accent':'#00ff41','--accent2':'#00cc33','--accent3':'#ff0000','--text':'#a0ffb0','--text2':'#1a5a1a','--screen-bg':'#000000','--screen-text':'#00ff41','--screen-dim':'#003300','--pad':'#00ff41','--pad-text':'#000000'}},
  {name:'Pink Wave',  dot:'#ff6eb4',vars:{'--bg':'#140a12','--surface':'#201020','--surface2':'#2e1530','--border':'#4a1a45','--accent':'#ff6eb4','--accent2':'#ff9de2','--accent3':'#ff3860','--text':'#f0c8e8','--text2':'#7a3a70','--screen-bg':'#0d0510','--screen-text':'#ff6eb4','--screen-dim':'#4a0a35','--pad':'#ff6eb4','--pad-text':'#140a12'}},
];
function applyTheme(idx){
  const t=THEMES[idx];
  for(const[k,v]of Object.entries(t.vars))document.documentElement.style.setProperty(k,v);
  document.querySelectorAll('.theme-dot').forEach((d,i)=>d.classList.toggle('active',i===idx));
  localStorage.setItem('app_theme',idx);
}
document.getElementById('theme-dots').innerHTML=THEMES.map((t,i)=>
  `<div class="theme-dot" style="background:${t.dot}" title="${t.name}" onclick="applyTheme(${i})"></div>`
).join('');
applyTheme(parseInt(localStorage.getItem('app_theme')||'0'));

/* TOAST */
let toastT=null;
function showToast(msg,err=false){
  const el=document.getElementById('toast'); el.textContent=msg;
  el.className='toast show'+(err?' err':'');
  if(toastT)clearTimeout(toastT);
  toastT=setTimeout(()=>el.className='toast',2800);
}

/* INDEXEDDB - cache locale dei file audio */
let idbDB=null;
function idbOpen(){
  return new Promise((res,rej)=>{
    if(idbDB){res(idbDB);return;}
    const req=indexedDB.open('musicacd_db',1);
    req.onupgradeneeded=e=>{ e.target.result.createObjectStore('songs'); };
    req.onsuccess=e=>{idbDB=e.target.result; res(idbDB);};
    req.onerror=e=>rej(e);
  });
}
function idbPutBlob(id,blob){
  return idbOpen().then(d=>new Promise((res,rej)=>{
    const tx=d.transaction('songs','readwrite');
    tx.objectStore('songs').put(blob,id);
    tx.oncomplete=()=>res(); tx.onerror=e=>rej(e);
  }));
}
function idbGetBlob(id){
  return idbOpen().then(d=>new Promise((res,rej)=>{
    const req=d.transaction('songs','readonly').objectStore('songs').get(id);
    req.onsuccess=()=>res(req.result||null); req.onerror=e=>rej(e);
  }));
}
function idbDelBlob(id){
  return idbOpen().then(d=>new Promise((res,rej)=>{
    const tx=d.transaction('songs','readwrite');
    tx.objectStore('songs').delete(id);
    tx.oncomplete=()=>res(); tx.onerror=e=>rej(e);
  }));
}
function idbClearAll(){
  return idbOpen().then(d=>new Promise((res,rej)=>{
    const tx=d.transaction('songs','readwrite');
    tx.objectStore('songs').clear();
    tx.oncomplete=()=>res(); tx.onerror=e=>rej(e);
  }));
}

/* HELPERS */
function arrayBufferToBase64(buffer){
  let binary=''; const bytes=new Uint8Array(buffer); const chunkSize=0x8000;
  for(let i=0;i<bytes.length;i+=chunkSize) binary+=String.fromCharCode.apply(null,bytes.subarray(i,i+chunkSize));
  return btoa(binary);
}
function base64ToArrayBuffer(base64){
  const binary=atob(base64); const bytes=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
  return bytes.buffer;
}
function formatTime(sec){
  if(!isFinite(sec)||sec<0)sec=0;
  const m=Math.floor(sec/60), s=Math.floor(sec%60);
  return m+':'+String(s).padStart(2,'0');
}
function getAudioDuration(blob){
  return new Promise(res=>{
    const url=URL.createObjectURL(blob); const a=new Audio(); a.preload='metadata';
    a.onloadedmetadata=()=>{res(a.duration||0); URL.revokeObjectURL(url);};
    a.onerror=()=>{res(0); URL.revokeObjectURL(url);};
    a.src=url;
  });
}

/* PLAYLIST STATE */
let playlist=JSON.parse(localStorage.getItem('musicacd_playlist')||'[]');
let currentIdx=-1;
let showFavOnly=false;
const audioEl=new Audio();
audioEl.volume=0.8;
const reelL=document.getElementById('reelL'), reelR=document.getElementById('reelR');
const cassetteLabel=document.getElementById('cassetteLabel');
const cassetteBody=document.getElementById('cassetteBody');

function savePlaylist(){ localStorage.setItem('musicacd_playlist',JSON.stringify(playlist)); }

/* LIBRERIA (overlay a carosello) */
function openLibrary(){
  document.getElementById('libraryOverlay').classList.add('show');
  renderCarousel();
}
function closeLibrary(){ document.getElementById('libraryOverlay').classList.remove('show'); }
function toggleFavFilter(){
  showFavOnly=!showFavOnly;
  document.getElementById('favBtn').classList.toggle('active',showFavOnly);
  renderCarousel();
}
function renderCarousel(){
  const wrap=document.getElementById('carousel');
  const shown=showFavOnly?playlist.filter(s=>s.fav):playlist;
  document.getElementById('libHeadCount').textContent=shown.length+(showFavOnly?' PREFERITI':' CASSETTE');
  if(!shown.length){ wrap.innerHTML='<div class="pl-empty">[ '+(showFavOnly?'NESSUN PREFERITO':'NESSUNA CASSETTA - AGGIUNGINE UNA')+' ]</div>'; return; }
  wrap.innerHTML='';
  shown.forEach(s=>{
    const realIdx=playlist.indexOf(s);
    const card=document.createElement('div');
    card.className='cass-card'+(realIdx===currentIdx?' active':'');
    card.innerHTML=`<div class="cass-mini"><div class="mini-reel"></div><div class="mini-reel"></div></div><div class="cass-title">${s.title}</div><div class="cass-dur">${s.duration?formatTime(s.duration):''} ${s.synced?'☁':'📱'}</div><div class="cass-btns"><button class="fav${s.fav?' on':''}" onclick="event.stopPropagation();toggleFav('${s.id}')">${s.fav?'★':'☆'}</button><button onclick="event.stopPropagation();renameSong('${s.id}')">✎</button><button class="del" onclick="event.stopPropagation();delSong('${s.id}')">×</button></div>`;
    card.onclick=()=>{ playSong(realIdx); closeLibrary(); };
    wrap.appendChild(card);
  });
  const hasUnsynced=playlist.some(x=>!x.synced);
  document.getElementById('syncBtn').style.display=(auth.currentUser&&hasUnsynced)?'':'none';
}

/* PREFERITI */
function toggleFav(id){
  const s=playlist.find(x=>x.id===id); if(!s)return;
  s.fav=!s.fav; savePlaylist(); renderCarousel();
  if(s.synced&&auth.currentUser){
    db.collection('musicaCD').doc(auth.currentUser.uid).collection('canzoni').doc(id).update({fav:s.fav}).catch(e=>console.error(e));
  }
}

/* UPLOAD */
async function handleFiles(files){
  for(const file of files){
    const id='song'+Date.now()+Math.floor(Math.random()*10000);
    const duration=await getAudioDuration(file);
    await idbPutBlob(id,file);
    const meta={id,title:file.name.replace(/\.[^.]+$/,''),size:file.size,mimeType:file.type||'audio/mpeg',duration,ordine:Date.now(),fav:false,synced:false};
    playlist.push(meta);
    savePlaylist(); renderCarousel();
    if(auth.currentUser){ await uploadSongToCloud(meta,file); }
  }
  document.getElementById('fileInput').value='';
  showToast('CASSETTE AGGIUNTE');
}

async function uploadSongToCloud(meta,fileOrBlob){
  try{
    showToast('CARICAMENTO SU CLOUD...');
    const uid=auth.currentUser.uid;
    const buf=await fileOrBlob.arrayBuffer();
    const base64=arrayBufferToBase64(buf);
    const chunkSize=700000;
    const chunks=[];
    for(let i=0;i<base64.length;i+=chunkSize) chunks.push(base64.slice(i,i+chunkSize));
    const songRef=db.collection('musicaCD').doc(uid).collection('canzoni').doc(meta.id);
    await songRef.set({title:meta.title,mimeType:meta.mimeType,size:meta.size,duration:meta.duration,ordine:meta.ordine,fav:meta.fav||false,numChunks:chunks.length});
    for(let i=0;i<chunks.length;i++){
      await songRef.collection('chunks').doc(String(i).padStart(5,'0')).set({d:chunks[i]});
    }
    meta.synced=true; savePlaylist(); renderCarousel();
    showToast('SINCRONIZZATA');
  }catch(e){
    console.error('Errore upload:',e);
    showToast('ERRORE SINCRONIZZAZIONE',true);
  }
}

async function syncLocalToCloud(){
  if(!auth.currentUser)return;
  for(const s of playlist){
    if(!s.synced){
      const blob=await idbGetBlob(s.id);
      if(blob) await uploadSongToCloud(s,blob);
    }
  }
}

/* DOWNLOAD DA CLOUD (altro dispositivo) */
async function fetchSongBlob(meta){
  const uid=auth.currentUser.uid;
  const songRef=db.collection('musicaCD').doc(uid).collection('canzoni').doc(meta.id);
  const snap=await songRef.collection('chunks').orderBy(firebase.firestore.FieldPath.documentId()).get();
  let base64='';
  snap.forEach(d=>base64+=d.data().d);
  const buf=base64ToArrayBuffer(base64);
  const blob=new Blob([buf],{type:meta.mimeType||'audio/mpeg'});
  await idbPutBlob(meta.id,blob);
  return blob;
}

/* RINOMINA / ELIMINA SINGOLA */
async function renameSong(id){
  const s=playlist.find(x=>x.id===id); if(!s)return;
  const nt=prompt('Nuovo nome cassetta:',s.title);
  if(!nt||!nt.trim())return;
  s.title=nt.trim(); savePlaylist(); renderCarousel();
  if(s.synced&&auth.currentUser){
    db.collection('musicaCD').doc(auth.currentUser.uid).collection('canzoni').doc(id).update({title:s.title}).catch(e=>console.error(e));
  }
  if(currentIdx>=0&&playlist[currentIdx].id===id) cassetteLabel.textContent=s.title;
}
async function delSong(id){
  const s=playlist.find(x=>x.id===id); if(!s)return;
  if(!confirm('Eliminare la cassetta "'+s.title+'"?'))return;
  const idx=playlist.findIndex(x=>x.id===id);
  if(idx===currentIdx){ stopPlayback(); currentIdx=-1; cassetteLabel.textContent='NESSUNA CASSETTA'; }
  playlist=playlist.filter(x=>x.id!==id);
  savePlaylist(); renderCarousel();
  await idbDelBlob(id);
  if(s.synced&&auth.currentUser){
    const songRef=db.collection('musicaCD').doc(auth.currentUser.uid).collection('canzoni').doc(id);
    const chunks=await songRef.collection('chunks').get();
    const batch=db.batch();
    chunks.forEach(c=>batch.delete(c.ref));
    await batch.commit().catch(e=>console.error(e));
    await songRef.delete().catch(e=>console.error(e));
  }
  showToast('CASSETTA ELIMINATA');
}

/* ELIMINA TUTTA LA LIBRERIA */
async function eliminaTutto(){
  if(!playlist.length){ showToast('LIBRERIA GIA VUOTA'); return; }
  if(!confirm('Eliminare TUTTA la libreria (anche dal cloud)? Operazione irreversibile.'))return;
  stopPlayback(); currentIdx=-1;
  cassetteLabel.textContent='NESSUNA CASSETTA';
  await idbClearAll();
  if(auth.currentUser){
    try{
      const uid=auth.currentUser.uid;
      const songsSnap=await db.collection('musicaCD').doc(uid).collection('canzoni').get();
      for(const doc of songsSnap.docs){
        const chunksSnap=await doc.ref.collection('chunks').get();
        const batch=db.batch();
        chunksSnap.forEach(c=>batch.delete(c.ref));
        await batch.commit();
        await doc.ref.delete();
      }
    }catch(e){ console.error(e); showToast('ERRORE ELIMINAZIONE CLOUD',true); }
  }
  playlist=[];
  savePlaylist(); renderCarousel();
  showToast('LIBRERIA ELIMINATA');
}

/* PLAYER */
async function playSong(idx){
  const s=playlist[idx]; if(!s)return;
  currentIdx=idx;
  cassetteLabel.textContent=s.title;
  let blob=await idbGetBlob(s.id);
  if(!blob){
    if(!s.synced){ showToast('FILE NON DISPONIBILE SU QUESTO DISPOSITIVO',true); return; }
    if(!auth.currentUser){ showToast('ACCEDI PER SCARICARE QUESTA CASSETTA',true); return; }
    showToast('SCARICAMENTO...');
    try{ blob=await fetchSongBlob(s); }catch(e){ console.error(e); showToast('ERRORE SCARICAMENTO',true); return; }
  }
  audioEl.src=URL.createObjectURL(blob);
  audioEl.play().catch(()=>{});
  if('mediaSession' in navigator){
    navigator.mediaSession.metadata=new MediaMetadata({title:s.title,artist:'Music CD'});
  }
}
function togglePlay(){
  if(currentIdx===-1){ if(playlist.length) playSong(0); else openLibrary(); return; }
  if(audioEl.paused) audioEl.play(); else audioEl.pause();
}
function stopPlayback(){ audioEl.pause(); audioEl.currentTime=0; updatePlayBtn(); }

let lastStopTap=0;
document.getElementById('stopBtn').addEventListener('click',()=>{
  const now=Date.now();
  stopPlayback();
  if(now-lastStopTap<450){ cassetteBody.classList.add('ejecting'); setTimeout(()=>cassetteBody.classList.remove('ejecting'),250); openLibrary(); }
  lastStopTap=now;
});

function updatePlayBtn(){
  const playing=!audioEl.paused;
  document.getElementById('playBtn').textContent=playing?'⏸':'▶';
  reelL.classList.toggle('playing',playing);
  reelR.classList.toggle('playing',playing);
}

audioEl.addEventListener('play',updatePlayBtn);
audioEl.addEventListener('pause',updatePlayBtn);
audioEl.addEventListener('ended',()=>{ if(playlist.length) playSong((currentIdx+1)%playlist.length); });
audioEl.addEventListener('timeupdate',()=>{
  if(audioEl.duration){ document.getElementById('seekBar').value=(audioEl.currentTime/audioEl.duration)*100; }
  document.getElementById('curTime').textContent=formatTime(audioEl.currentTime);
  document.getElementById('durTime').textContent=formatTime(audioEl.duration);
});
document.getElementById('seekBar').addEventListener('input',function(){
  if(audioEl.duration) audioEl.currentTime=(this.value/100)*audioEl.duration;
});
document.getElementById('volBar').addEventListener('input',function(){ audioEl.volume=this.value/100; });

/* RIAVVOLGIMENTO / AVANZAMENTO (tieni premuto) */
let seekInterval=null;
function startSeek(dir,btn){
  if(currentIdx===-1)return;
  reelL.classList.add(dir>0?'fast-fwd':'fast-rew');
  reelR.classList.add(dir>0?'fast-fwd':'fast-rew');
  audioEl.currentTime=Math.min(Math.max(audioEl.currentTime+dir*2,0),audioEl.duration||0);
  seekInterval=setInterval(()=>{
    audioEl.currentTime=Math.min(Math.max(audioEl.currentTime+dir*2,0),audioEl.duration||0);
  },120);
}
function stopSeek(){
  clearInterval(seekInterval); seekInterval=null;
  reelL.classList.remove('fast-fwd','fast-rew');
  reelR.classList.remove('fast-fwd','fast-rew');
  updatePlayBtn();
}
const rewBtn=document.getElementById('rewBtn'), ffBtn=document.getElementById('ffBtn');
['mousedown','touchstart'].forEach(ev=>{
  rewBtn.addEventListener(ev,e=>{e.preventDefault();startSeek(-1);});
  ffBtn.addEventListener(ev,e=>{e.preventDefault();startSeek(1);});
});
['mouseup','mouseleave','touchend'].forEach(ev=>{
  rewBtn.addEventListener(ev,stopSeek);
  ffBtn.addEventListener(ev,stopSeek);
});

if('mediaSession' in navigator){
  navigator.mediaSession.setActionHandler('play',()=>audioEl.play());
  navigator.mediaSession.setActionHandler('pause',()=>audioEl.pause());
  navigator.mediaSession.setActionHandler('previoustrack',()=>{ if(playlist.length) playSong((currentIdx-1+playlist.length)%playlist.length); });
  navigator.mediaSession.setActionHandler('nexttrack',()=>{ if(playlist.length) playSong((currentIdx+1)%playlist.length); });
}
</script>

async function sincronizzaAllAccesso(uid){
  try{
    const ref=db.collection('musicaCD').doc(uid).collection('canzoni');
    const snap=await ref.get();
    snap.forEach(doc=>{
      const d=doc.data();
      if(!playlist.find(s=>s.id===doc.id)){
        playlist.push({id:doc.id,title:d.title,size:d.size,mimeType:d.mimeType,duration:d.duration,ordine:d.ordine,fav:d.fav||false,synced:true});

    });
    playlist.sort((a,b)=>(a.ordine||0)-(b.ordine||0));
    savePlaylist();
    showToast('LIBRERIA SINCRONIZZATA');
  }catch(e){
    console.error("Errore sync:",e);
    showToast('SYNC FALLITA',true);
  }
}
