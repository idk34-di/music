<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VERSION 1.1</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;500;600&display=swap');
  :root{
    --bg:#0a0e14;--surface:#111820;--surface2:#1a2330;--border:#1e3040;
    --accent:#5bc8e8;--accent2:#00ff88;--accent3:#ff6b6b;
    --text:#c8dce8;--text2:#4a7090;--screen-bg:#000d14;--screen-text:#00d4ff;--screen-dim:#003355;
    --font-mono:'Share Tech Mono',monospace;--font-ui:'Rajdhani',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:var(--font-ui);min-height:100vh;transition:background .4s,color .4s;}
  header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:1rem 1.5rem;border-bottom:1px solid var(--border);background:var(--surface);}
  .theme-picker{display:flex;gap:6px;align-items:center;justify-self:start;}
  .theme-dot{width:18px;height:18px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .15s;flex-shrink:0;}
  .theme-dot.active{border-color:var(--text);transform:scale(1.2);}
  .header-title{font-family:var(--font-mono);letter-spacing:2px;color:var(--accent);font-size:13px;white-space:nowrap;justify-self:center;}
  .header-right{display:flex;align-items:center;gap:10px;justify-self:end;}
  #contatore{font-family:var(--font-mono);font-size:11px;color:var(--text2);white-space:nowrap;}
  #user-info{color:var(--accent2);cursor:pointer;font-family:var(--font-mono);font-size:11px;white-space:nowrap;}
  main{max-width:640px;margin:0 auto;padding:1.5rem 1rem;display:flex;flex-direction:column;gap:1rem;}
  .device{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:1.25rem;}
  .screen{background:var(--screen-bg);border:1px solid #002233;border-radius:3px;padding:14px;margin-bottom:1.25rem;font-family:var(--font-mono);text-align:center;}
  .screen-title{color:var(--screen-text);font-size:14px;letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:8px;}
  .screen-time{color:var(--screen-dim);font-size:11px;display:flex;justify-content:space-between;margin-top:4px;}
  .progress-bar{width:100%;height:4px;background:var(--border);border-radius:2px;cursor:pointer;position:relative;margin-top:8px;}
  .progress-fill{height:100%;background:var(--accent);border-radius:2px;width:0%;}
  .transport{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:1rem;}
  .tbtn{background:var(--surface2);border:1px solid var(--border);color:var(--text);width:42px;height:42px;border-radius:50%;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;}
  .tbtn.play{width:56px;height:56px;background:var(--accent);color:var(--bg);border-color:var(--accent);font-size:20px;}
  .tbtn.toggled{border-color:var(--accent);color:var(--accent);}
  .load-row{display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap;}
  .btn{padding:8px 14px;border-radius:2px;border:1px solid var(--border);background:transparent;color:var(--text);font-family:var(--font-mono);font-size:11px;cursor:pointer;letter-spacing:1px;}
  .btn:hover{border-color:var(--accent);color:var(--accent);}
  .playlist{display:flex;flex-direction:column;gap:4px;max-height:50vh;overflow-y:auto;}
  .track{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--border);border-radius:3px;padding:8px 10px;}
  .track.current{border-color:var(--accent);}
  .track-name{flex:1;font-family:var(--font-mono);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:text;}
  .track-dur{font-family:var(--font-mono);font-size:10px;color:var(--text2);}
  .track-btn{background:none;border:none;color:var(--text2);cursor:pointer;font-size:13px;padding:2px 4px;}
  .track-btn:hover{color:var(--accent);}
  .vol-row{display:flex;justify-content:center;margin-top:1rem;}
  .knob-group{display:flex;flex-direction:column;align-items:center;gap:5px;}
  .knob{width:48px;height:48px;border-radius:50%;border:1px solid var(--border);background:var(--surface2);cursor:ns-resize;display:flex;align-items:center;justify-content:center;position:relative;user-select:none;}
  .knob-dot{width:3px;height:14px;background:var(--accent);border-radius:2px;position:absolute;top:4px;transform-origin:bottom center;}
  .knob-val{font-family:var(--font-mono);font-size:10px;color:var(--accent);}
  .knob-label{font-family:var(--font-mono);font-size:9px;color:var(--text2);letter-spacing:1px;}
  #file-input{display:none;}
</style>
</head>
<body>
<header>
  <div class="theme-picker" id="theme-dots"></div>
  <span class="header-title">MUSIC PLAYER</span>
  <div class="header-right">
    <span id="contatore">👁 …</span>
    <button id="login-btn" class="btn" onclick="accedi()">ACCEDI</button>
    <span id="user-info" style="display:none;" onclick="esci()"></span>
  </div>
</header>
<main>
  <input type="file" id="file-input" accept="audio/*" multiple>
  <div class="load-row">
    <button class="btn" onclick="document.getElementById('file-input').click()">📁 SCEGLI FILE</button>
    <button class="btn" id="folder-btn" onclick="pickFolder()" style="display:none;">📂 CARTELLA (ricorda)</button>
  </div>
  <div class="device">
    <div class="screen">
      <div class="screen-title" id="screen-title">Nessun brano caricato</div>
      <div class="progress-bar" id="progress-bar" onclick="seek(event)"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="screen-time"><span id="cur-time">0:00</span><span id="dur-time">0:00</span></div>
    </div>
    <div class="transport">
      <button class="tbtn" id="shuffle-btn" onclick="toggleShuffle()" title="Shuffle">🔀</button>
      <button class="tbtn" onclick="prevTrack()">⏮</button>
      <button class="tbtn play" id="play-btn" onclick="togglePlay()">▶</button>
      <button class="tbtn" onclick="nextTrack()">⏭</button>
      <button class="tbtn" id="repeat-btn" onclick="toggleRepeat()" title="Repeat">🔁</button>
    </div>
    <div class="vol-row">
      <div class="knob-group">
        <div class="knob" id="vol-knob" onmousedown="startKnob(event)" ontouchstart="startKnobT(event)">
          <div class="knob-dot" id="vol-knob-dot"></div>
        </div>
        <div class="knob-val" id="vol-knob-val">80%</div>
        <div class="knob-label">VOL</div>
      </div>
    </div>
  </div>
  <div class="playlist" id="playlist"></div>
</main>

<script>
// ═══════════════ TEMI ═══════════════
const THEMES=[
 {name:'Cyan Night',dot:'#5bc8e8',vars:{'--bg':'#0a0e14','--surface':'#111820','--surface2':'#1a2330','--border':'#1e3040','--accent':'#5bc8e8','--accent2':'#00ff88','--accent3':'#ff6b6b','--text':'#c8dce8','--text2':'#4a7090','--screen-bg':'#000d14','--screen-text':'#00d4ff','--screen-dim':'#003355'}},
 {name:'Purple Haze',dot:'#b06ef3',vars:{'--bg':'#0d0814','--surface':'#160e20','--surface2':'#1f1530','--border':'#2d1f45','--accent':'#b06ef3','--accent2':'#f06edf','--accent3':'#ff6b6b','--text':'#d8c8f0','--text2':'#5a3a80','--screen-bg':'#08040f','--screen-text':'#c87fff','--screen-dim':'#2a0a50'}},
 {name:'Sunset',dot:'#ff8c42',vars:{'--bg':'#14080a','--surface':'#201010','--surface2':'#301818','--border':'#451f1f','--accent':'#ff8c42','--accent2':'#ffd166','--accent3':'#ef476f','--text':'#f0d8c8','--text2':'#804030','--screen-bg':'#0f0508','--screen-text':'#ff8c42','--screen-dim':'#500f00'}},
 {name:'Ice',dot:'#a8d8ea',vars:{'--bg':'#f0f6fa','--surface':'#e4eef5','--surface2':'#d0e4f0','--border':'#b0ccde','--accent':'#1e7fb5','--accent2':'#16a085','--accent3':'#e74c3c','--text':'#1a3a4a','--text2':'#5a8aaa','--screen-bg':'#0a2030','--screen-text':'#5bc8e8','--screen-dim':'#0a3050'}},
 {name:'Matrix',dot:'#00ff41',vars:{'--bg':'#000000','--surface':'#030f03','--surface2':'#071807','--border':'#0a280a','--accent':'#00ff41','--accent2':'#00cc33','--accent3':'#ff0000','--text':'#a0ffb0','--text2':'#1a5a1a','--screen-bg':'#000000','--screen-text':'#00ff41','--screen-dim':'#003300'}},
 {name:'Pink Wave',dot:'#ff6eb4',vars:{'--bg':'#140a12','--surface':'#201020','--surface2':'#2e1530','--border':'#4a1a45','--accent':'#ff6eb4','--accent2':'#ff9de2','--accent3':'#ff3860','--text':'#f0c8e8','--text2':'#7a3a70','--screen-bg':'#0d0510','--screen-text':'#ff6eb4','--screen-dim':'#4a0a35'}},
];
let activeTheme=0;
function applyTheme(i){activeTheme=i;const t=THEMES[i];for(const [k,v] of Object.entries(t.vars))document.documentElement.style.setProperty(k,v);document.querySelectorAll('.theme-dot').forEach((d,j)=>d.classList.toggle('active',j===i));localStorage.setItem('mpTheme',i);}
function buildThemeDots(){document.getElementById('theme-dots').innerHTML=THEMES.map((t,i)=>`<div class="theme-dot${i===activeTheme?' active':''}" style="background:${t.dot}" title="${t.name}" onclick="applyTheme(${i})"></div>`).join('');}
buildThemeDots();applyTheme(parseInt(localStorage.getItem('mpTheme')||'0'));

// ═══════════════ STATO ═══════════════
const audio=new Audio();
let tracks=[]; // {fp, file, name, url, duration}
let currentIndex=-1, isPlaying=false, shuffle=false, repeatMode=0, dragFrom=null;

// ---- nomi e ordine salvati (localStorage) ----
function loadMeta(){try{return JSON.parse(localStorage.getItem('mpMeta')||'{}');}catch(e){return{};}}
function saveMeta(){
  const meta={};tracks.forEach((t,i)=>{meta[t.fp]={name:t.name,order:i};});
  localStorage.setItem('mpMeta',JSON.stringify(meta));
  salvaDatiUtente();
}
function applyMetaAndSort(){
  const meta=loadMeta();
  tracks.forEach(t=>{if(meta[t.fp])t.name=meta[t.fp].name;});
  tracks.sort((a,b)=>{const oa=meta[a.fp]?meta[a.fp].order:9999,ob=meta[b.fp]?meta[b.fp].order:9999;return oa-ob;});
}

function addFiles(fileList){
  let added=0;
  for(const file of fileList){
    const isAudio=file.type.startsWith('audio/')||/\.(mp3|wav|ogg|m4a|flac|aac|opus|weba)$/i.test(file.name);
    if(!isAudio)continue;
    const fp=file.name+'|'+file.size;
    if(tracks.some(t=>t.fp===fp))continue;
    tracks.push({fp,file,name:file.name.replace(/\.[a-z0-9]+$/i,''),url:null,duration:0});
    added++;
  }
  applyMetaAndSort();renderPlaylist();
  if(added)showToast(added+' brani caricati');
}
document.getElementById('file-input').addEventListener('change',e=>{addFiles(e.target.files);e.target.value='';});

// ---- Cartella persistente (Chrome/Edge/Android) ----
if('showDirectoryPicker' in window)document.getElementById('folder-btn').style.display='';
function idbOp(mode,fn){return new Promise((res,rej)=>{const r=indexedDB.open('mpFilesDB',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{const tx=r.result.transaction('kv',mode);fn(tx.objectStore('kv'),res,rej);};r.onerror=()=>rej(r.error);});}
function idbSet(k,v){return idbOp('readwrite',(s,res)=>{s.put(v,k);res();});}
function idbGet(k){return idbOp('readonly',(s,res,rej)=>{const rq=s.get(k);rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);});}
async function pickFolder(){
  try{const handle=await window.showDirectoryPicker();await idbSet('dirHandle',handle);await loadFromDirHandle(handle);}catch(e){}
}
async function loadFromDirHandle(handle){
  const files=[];
  for await (const entry of handle.values()){
    if(entry.kind==='file'&&/\.(mp3|wav|ogg|m4a|flac|aac|opus)$/i.test(entry.name))files.push(await entry.getFile());
  }
  addFiles(files);
}
async function tryRestoreFolder(){
  if(!('showDirectoryPicker' in window))return;
  try{
    const handle=await idbGet('dirHandle');if(!handle)return;
    const perm=await handle.queryPermission({mode:'read'});
    if(perm==='granted')await loadFromDirHandle(handle);
    else showToast('Tocca 📂 CARTELLA per ridare accesso ai file');
  }catch(e){}
}
tryRestoreFolder();

// ---- Riproduzione ----
function playAt(i){
  if(i<0||i>=tracks.length)return;
  currentIndex=i;const t=tracks[i];
  if(!t.url)t.url=URL.createObjectURL(t.file);
  audio.src=t.url;audio.play().catch(()=>{});isPlaying=true;
  renderPlayer();renderPlaylist();updateMediaSession();
}
function togglePlay(){
  if(currentIndex===-1){if(tracks.length)playAt(0);return;}
  if(isPlaying){audio.pause();isPlaying=false;}else{audio.play();isPlaying=true;}
  renderPlayer();renderPlaylist();updateMediaSession();
}
function nextTrack(){
  if(!tracks.length)return;
  let i=shuffle?Math.floor(Math.random()*tracks.length):currentIndex+1;
  if(i>=tracks.length){if(repeatMode===1)i=0;else{isPlaying=false;renderPlayer();return;}}
  playAt(i);
}
function prevTrack(){
  if(!tracks.length)return;
  if(audio.currentTime>3){audio.currentTime=0;return;}
  let i=currentIndex-1;if(i<0)i=repeatMode===1?tracks.length-1:0;
  playAt(i);
}
function toggleShuffle(){shuffle=!shuffle;document.getElementById('shuffle-btn').classList.toggle('toggled',shuffle);}
function toggleRepeat(){repeatMode=(repeatMode+1)%3;const b=document.getElementById('repeat-btn');b.classList.toggle('toggled',repeatMode>0);b.textContent=repeatMode===2?'🔂':'🔁';}
audio.addEventListener('ended',()=>{if(repeatMode===2){audio.currentTime=0;audio.play();}else nextTrack();});
audio.addEventListener('timeupdate',updateProgress);
audio.addEventListener('loadedmetadata',()=>{if(currentIndex>-1){tracks[currentIndex].duration=audio.duration;renderPlaylist();}});
function seek(e){
  if(!audio.duration)return;
  const bar=document.getElementById('progress-bar');
  const pct=(e.clientX-bar.getBoundingClientRect().left)/bar.offsetWidth;
  audio.currentTime=pct*audio.duration;
}
function fmt(s){if(!isFinite(s))return'0:00';const m=Math.floor(s/60),sec=Math.floor(s%60);return m+':'+String(sec).padStart(2,'0');}
function updateProgress(){
  document.getElementById('cur-time').textContent=fmt(audio.currentTime);
  document.getElementById('dur-time').textContent=fmt(audio.duration);
  document.getElementById('progress-fill').style.width=(audio.duration?(audio.currentTime/audio.duration*100):0)+'%';
  if('mediaSession' in navigator&&audio.duration){try{navigator.mediaSession.setPositionState({duration:audio.duration,playbackRate:1,position:audio.currentTime});}catch(e){}}
}

// ---- Media Session (controlli a schermo bloccato) ----
function updateMediaSession(){
  if(!('mediaSession' in navigator)||currentIndex===-1)return;
  navigator.mediaSession.metadata=new MediaMetadata({title:tracks[currentIndex].name,artist:'Music Player',album:'La mia playlist'});
  navigator.mediaSession.playbackState=isPlaying?'playing':'paused';
}
if('mediaSession' in navigator){
  navigator.mediaSession.setActionHandler('play',()=>{audio.play();isPlaying=true;renderPlayer();updateMediaSession();});
  navigator.mediaSession.setActionHandler('pause',()=>{audio.pause();isPlaying=false;renderPlayer();updateMediaSession();});
  navigator.mediaSession.setActionHandler('previoustrack',prevTrack);
  navigator.mediaSession.setActionHandler('nexttrack',nextTrack);
  navigator.mediaSession.setActionHandler('seekto',d=>{if(d.seekTime!==undefined)audio.currentTime=d.seekTime;});
}

// ---- Rinomina / riordina / rimuovi ----
function renameTrack(i){
  const el=document.getElementById('name-'+i);
  const input=document.createElement('input');
  input.value=tracks[i].name;
  input.style.cssText='width:100%;background:var(--surface);border:1px solid var(--accent);color:var(--text);font-family:var(--font-mono);font-size:12px;padding:2px 4px;';
  el.replaceWith(input);input.focus();input.select();
  function commit(){tracks[i].name=input.value.trim()||tracks[i].name;saveMeta();renderPlaylist();if(i===currentIndex)updateMediaSession();}
  input.addEventListener('blur',commit);
  input.addEventListener('keydown',e=>{if(e.key==='Enter')input.blur();});
}
function moveTrack(i,dir){
  const j=i+dir;if(j<0||j>=tracks.length)return;
  [tracks[i],tracks[j]]=[tracks[j],tracks[i]];
  if(currentIndex===i)currentIndex=j;else if(currentIndex===j)currentIndex=i;
  saveMeta();renderPlaylist();
}
function removeTrack(i){
  if(tracks[i].url)URL.revokeObjectURL(tracks[i].url);
  if(i===currentIndex){audio.pause();isPlaying=false;currentIndex=-1;}
  else if(i<currentIndex)currentIndex--;
  tracks.splice(i,1);saveMeta();renderPlaylist();renderPlayer();
}
function dragStart(i){dragFrom=i;}
function dragOverRow(e){e.preventDefault();}
function dropRow(i){
  if(dragFrom===null||dragFrom===i)return;
  const [moved]=tracks.splice(dragFrom,1);tracks.splice(i,0,moved);
  saveMeta();renderPlaylist();dragFrom=null;
}

// ---- Render ----
function renderPlayer(){
  document.getElementById('play-btn').textContent=isPlaying?'⏸':'▶';
  document.getElementById('screen-title').textContent=currentIndex>-1?tracks[currentIndex].name:'Nessun brano caricato';
}
function renderPlaylist(){
  const el=document.getElementById('playlist');
  if(!tracks.length){el.innerHTML='<div style="font-family:var(--font-mono);font-size:11px;color:var(--text2);padding:1rem;text-align:center;">Nessun brano. Carica dei file per iniziare.</div>';return;}
  el.innerHTML=tracks.map((t,i)=>`
    <div class="track${i===currentIndex?' current':''}" draggable="true" ondragstart="dragStart(${i})" ondragover="dragOverRow(event)" ondrop="dropRow(${i})">
      <button class="track-btn" onclick="${i===currentIndex?'togglePlay()':'playAt('+i+')'}">${i===currentIndex&&isPlaying?'⏸':'▶'}</button>
      <span class="track-name" id="name-${i}" ondblclick="renameTrack(${i})" title="Doppio click per rinominare">${t.name}</span>
      <span class="track-dur">${t.duration?fmt(t.duration):''}</span>
      <button class="track-btn" onclick="moveTrack(${i},-1)">↑</button>
      <button class="track-btn" onclick="moveTrack(${i},1)">↓</button>
      <button class="track-btn" onclick="removeTrack(${i})">✕</button>
    </div>`).join('');
}

// ---- Rotellina volume ----
let volDrag=null;
function knobAngle(v){return -135+v*270;}
function setVolKnob(v,persist=true){
  v=Math.max(0,Math.min(1,v));
  audio.volume=v;
  document.getElementById('vol-knob-dot').style.transform=`rotate(${knobAngle(v)}deg)`;
  document.getElementById('vol-knob-val').textContent=Math.round(v*100)+'%';
  if(persist)localStorage.setItem('mpVolume',v);
}
function startKnob(e){
  e.preventDefault();
  volDrag={startY:e.clientY,startVal:audio.volume};
  const move=ev=>{if(!volDrag)return;setVolKnob(volDrag.startVal+(volDrag.startY-ev.clientY)/120);};
  document.addEventListener('mousemove',move);
  document.addEventListener('mouseup',()=>{volDrag=null;document.removeEventListener('mousemove',move);},{once:true});
}
function startKnobT(e){
  e.preventDefault();
  const t0=e.touches[0];volDrag={startY:t0.clientY,startVal:audio.volume};
  const move=ev=>{if(!volDrag)return;setVolKnob(volDrag.startVal+(volDrag.startY-ev.touches[0].clientY)/120);};
  document.addEventListener('touchmove',move,{passive:false});
  document.addEventListener('touchend',()=>{volDrag=null;document.removeEventListener('touchmove',move);},{once:true});
}
setVolKnob(parseFloat(localStorage.getItem('mpVolume')||'0.8'),false);

let toastTimer=null;
function showToast(msg){
  let t=document.getElementById('toast');
  if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--accent);color:var(--bg);font-family:var(--font-mono);font-size:11px;padding:10px 18px;border-radius:3px;z-index:999;transition:transform .3s;';document.body.appendChild(t);}
  t.textContent=msg;t.style.transform='translateX(-50%) translateY(0)';
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.style.transform='translateX(-50%) translateY(60px)';},2000);
}

renderPlaylist();renderPlayer();
</script>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyA0-O7pTF_M_DmJ2mkvlGqkJuoD5Lc_WjE",
  authDomain: "workspace-5e87a.firebaseapp.com",
  projectId: "workspace-5e87a"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

async function incrementaContatore() {
  try {
    const ref = db.collection("stats").doc("visite_musicplayer");
    await db.runTransaction(async (t) => {
      const doc = await t.get(ref);
      const attuale = doc.exists ? doc.data().count : 0;
      t.set(ref, { count: attuale + 1 });
    });
    const doc = await ref.get();
    document.getElementById("contatore").textContent = "👁 " + doc.data().count;
  } catch (e) { console.error("Errore contatore:", e); }
}
incrementaContatore();

function accedi() {
  auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e => {
    console.error("Errore login:", e);
    showToast('LOGIN FAILED');
  });
}
function esci() { auth.signOut(); }

let currentUser = null;
let datiRemotiCaricati = false;

auth.onAuthStateChanged(async (user) => {
  currentUser = user;
  document.getElementById("login-btn").style.display = user ? "none" : "";
  document.getElementById("user-info").style.display = user ? "" : "none";
  if (user) {
    document.getElementById("user-info").textContent = user.displayName || user.email;
    datiRemotiCaricati = false;
    await caricaDatiUtente(user.uid);
    datiRemotiCaricati = true;
  } else {
    datiRemotiCaricati = false;
  }
});

async function caricaDatiUtente(uid) {
  try {
    const doc = await db.collection("utenti").doc(uid).get();
    if (doc.exists && doc.data().musicMeta) {
      localStorage.setItem('mpMeta', JSON.stringify(doc.data().musicMeta));
      applyMetaAndSort();
      renderPlaylist();
    }
    showToast('DATI SINCRONIZZATI');
  } catch (e) {
    console.error("Errore caricamento dati:", e);
    showToast('SYNC FAILED');
  }
}

let salvataggioTimer = null;
function salvaDatiUtente() {
  if (!currentUser || !datiRemotiCaricati) return;
  clearTimeout(salvataggioTimer);
  salvataggioTimer = setTimeout(() => {
    db.collection("utenti").doc(currentUser.uid).set({ musicMeta: loadMeta() }, { merge: true })
      .catch(e => console.error("Errore salvataggio:", e));
  }, 800);
}
</script>
